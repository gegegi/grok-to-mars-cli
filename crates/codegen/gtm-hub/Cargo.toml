[package]
name = "gtm-hub"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Grok to Mars local session hub (fork-owned; not in upstream grok-pager)"
publish = false
autobins = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
dirs = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
rustls = { workspace = true }
tokio-rustls = "0.26"
sha2 = { workspace = true }

[[bin]]
name = "fake_agent"
path = "src/bin/gtm-hub-fake-agent.rs"
test = false
doc = false
bench = false

[dev-dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "time",
] }
